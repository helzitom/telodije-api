spring:
  application:
    name: telodije-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/telodije-db?stringtype=unspecified}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: ${FLYWAY_ACTIVO:false}
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  address: 0.0.0.0

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secreto: ${JWT_SECRETO}
  expiracion-acceso-minutos: 15
  expiracion-refresh-dias: 14

seguridad:
  intentos-maximos: 5
  minutos-bloqueo: 15

almacenamiento:
  ruta-local: ${ALMACEN_RUTA:./almacen}

importacion:
  overpass-url: https://overpass-api.de/api/interpreter